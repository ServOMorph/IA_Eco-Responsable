<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Générateur d'images</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main>
      <h1>Générateur d'images</h1>

      <p id="alerte" class="alerte" hidden></p>

      <form id="formulaire">
        <label for="description">Décrivez l'image</label>
        <textarea id="description" rows="3" placeholder="Exemple : une pomme rouge sur une table en bois"></textarea>

        <fieldset>
          <legend>Format</legend>
          <label><input type="radio" name="format" value="carre" checked /> Carré</label>
          <label><input type="radio" name="format" value="portrait" /> Portrait</label>
          <label><input type="radio" name="format" value="paysage" /> Paysage</label>
        </fieldset>

        <button type="submit" id="bouton">Générer</button>
      </form>

      <p id="statut" role="status"></p>

      <figure id="resultat" hidden>
        <img id="image" alt="Image générée" />
        <figcaption id="legende"></figcaption>
      </figure>

      <button type="button" id="dossier" class="secondaire">Ouvrir le dossier des images</button>
    </main>
  </body>
</html>
